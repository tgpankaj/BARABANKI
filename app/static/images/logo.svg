<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Outer glow -->
  <defs>
    <filter id="pin-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="pin-gold" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
  </defs>
  <!-- Pin Body -->
  <path d="M24 3C14.61 3 7 10.61 7 20c0 10.5 14.5 24.2 16.2 25.8.4.4 1.2.4 1.6 0 1.7-1.6 16.2-15.3 16.2-25.8 0-9.39-7.61-17-17-17z" fill="url(#pin-gold)" filter="url(#pin-shadow)"/>
  <!-- Inner White Circle -->
  <circle cx="24" cy="19" r="8.5" fill="#06233F"/>
  <!-- Golden Connection Nodes (Network/Connect Symbol) -->
  <circle cx="24" cy="15.5" r="2.2" fill="#FFC928"/>
  <circle cx="20" cy="21.5" r="2" fill="#FFC928"/>
  <circle cx="28" cy="21.5" r="2" fill="#FFC928"/>
  <line x1="24" y1="15.5" x2="20" y2="21.5" stroke="#FFC928" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="15.5" x2="28" y2="21.5" stroke="#FFC928" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="21.5" x2="28" y2="21.5" stroke="#FFC928" stroke-width="1.5" stroke-linecap="round"/>
</svg>
