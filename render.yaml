services:
  - type: web
    name: barabanki-connect
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: barabanki-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: barabanki-db
    databaseName: barabanki_connect
    user: barabanki_user
    plan: free
    region: singapore
