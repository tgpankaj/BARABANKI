<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="description" content="Barabanki Connect — Apna Barabanki, Ab Ek Click Door! The comprehensive community portal for residents, students, businesses, and tourists of District Barabanki, Uttar Pradesh.">
  <meta name="theme-color" content="#06233F">
  <title>{% block title %}Barabanki Connect — Apna Barabanki, Ab Ek Click Door!{% endblock %}</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/static/images/logo.svg">

  <!-- Google Font: Inter & Noto Sans Devanagari -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS for OpenStreetMap -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Custom Design System Stylesheet -->
  <link rel="stylesheet" href="/static/css/style.css">

  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- Accessibility: Skip to Main Content Link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Navigation Header -->
  {% include "components/navbar.html" %}

  <!-- Flash / System Alerts Container -->
  <div class="container" style="margin-top: 1rem;">
    {% include "components/alerts.html" %}
  </div>

  <!-- Main Content Area -->
  <main id="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Global Footer -->
  {% include "components/footer.html" %}

  <!-- Mobile Bottom Sticky App Bar -->
  {% include "components/bottom_nav.html" %}

  <!-- Leaflet JS for OpenStreetMap -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Chart.js for Dashboards -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <!-- Barabanki Connect Core JavaScript -->
  <script src="/static/js/main.js"></script>
  <script src="/static/js/map.js"></script>
  <script src="/static/js/admin_charts.js"></script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
