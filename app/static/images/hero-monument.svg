<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#041424"/>
      <stop offset="60%" stop-color="#082D50"/>
      <stop offset="100%" stop-color="#113e6d"/>
    </linearGradient>
    <linearGradient id="monumentGlow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ffb703" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#fb8500" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#FFC928" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#0878F9" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#06233F" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurLight">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Sky & Atmospheric Glow -->
  <rect width="800" height="500" fill="url(#nightSky)"/>
  <circle cx="480" cy="300" r="280" fill="url(#sunGlow)"/>

  <!-- Warm Ground Base -->
  <rect y="420" width="800" height="80" fill="#04121f"/>

  <!-- Distant Minarets & Domes Silhouette -->
  <path d="M 80 420 L 80 340 L 95 310 L 110 340 L 110 420 Z" fill="#0b2c48" opacity="0.6"/>
  <path d="M 220 420 L 220 320 Q 250 280 280 320 L 280 420 Z" fill="#0c3252" opacity="0.5"/>
  <path d="M 680 420 L 680 330 L 695 300 L 710 330 L 710 420 Z" fill="#0b2c48" opacity="0.6"/>

  <!-- Central Monument Structure (Awadhi Architectural Arches & Gateway) -->
  <g transform="translate(160, 80)">
    <!-- Main Outer Arch Frame -->
    <path d="M 60 340 L 60 160 Q 60 40 240 40 Q 420 40 420 160 L 420 340 Z" fill="#b07d38" opacity="0.9"/>
    
    <!-- Outer Decorative Chhatris and Minarets -->
    <path d="M 40 340 L 40 120 L 55 90 L 70 120 L 70 340 Z" fill="#d49a45"/>
    <path d="M 410 340 L 410 120 L 425 90 L 440 120 L 440 340 Z" fill="#d49a45"/>

    <!-- Small Domes on Roof -->
    <path d="M 120 70 Q 140 35 160 70 Z" fill="#e0a955"/>
    <path d="M 220 45 Q 240 10 260 45 Z" fill="#fcd34d"/>
    <path d="M 320 70 Q 340 35 360 70 Z" fill="#e0a955"/>

    <!-- Main Arch Portal Opening -->
    <path d="M 120 340 L 120 190 Q 120 100 240 100 Q 360 100 360 190 L 360 340 Z" fill="#1b120c"/>

    <!-- Inner Golden Backlit Arch -->
    <path d="M 140 340 L 140 200 Q 140 120 240 120 Q 340 120 340 200 L 340 340 Z" fill="url(#monumentGlow)"/>

    <!-- Tiered Cusped Arch Details (Classic Awadhi Lakhnawi/Barabanki motif) -->
    <path d="M 160 340 L 160 220 Q 180 200 200 220 Q 220 190 240 160 Q 260 190 280 220 Q 300 200 320 220 L 320 340 Z" fill="#3a2208" opacity="0.85"/>

    <!-- Center Deep Passage -->
    <path d="M 190 340 L 190 250 Q 240 210 290 250 L 290 340 Z" fill="#110702"/>

    <!-- Golden Lantern / Chandelier Glow -->
    <circle cx="240" cy="245" r="14" fill="#FFC928" filter="url(#blurLight)"/>
    <circle cx="240" cy="245" r="6" fill="#FFFFFF"/>

    <!-- Delicate Jali Lattice Windows -->
    <rect x="80" y="180" width="25" height="45" rx="12" fill="#2d1b09"/>
    <rect x="375" y="180" width="25" height="45" rx="12" fill="#2d1b09"/>
    <rect x="80" y="250" width="25" height="55" rx="6" fill="#2d1b09"/>
    <rect x="375" y="250" width="25" height="55" rx="6" fill="#2d1b09"/>
  </g>

  <!-- Ground Reflection & Light Pool -->
  <ellipse cx="400" cy="425" rx="200" ry="25" fill="#FFC928" opacity="0.25" filter="url(#blurLight)"/>
</svg>
